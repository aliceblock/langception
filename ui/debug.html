<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Langception — Debug Log</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="debug.css" />
  </head>
  <body>
    <!-- The "which stage is slow" answer at the top: rolling per-stage
         averages/min/max since the window opened, or the last Clear
         (ticket 47). Export… (ticket 49) writes the whole session to a
         picked file, Clear (ticket 52) resets it in place; both hidden
         until a rendered event arrives. -->
    <header id="topbar">
      <div id="summary" class="empty" data-i18n="debug.empty_summary">waiting for the first pass…</div>
      <span id="export-status" hidden></span>
      <button id="export-btn" type="button" hidden data-i18n="debug.export_btn">Export…</button>
      <button id="clear-btn" type="button" hidden data-i18n="debug.clear_btn">Clear</button>
    </header>
    <main id="rows"></main>
    <script src="i18n.js"></script>
    <script src="debug.js"></script>
  </body>
</html>
