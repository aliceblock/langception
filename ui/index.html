<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Langception — Results</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Frameless window (ticket 16): the first row is the drag region —
         drag moves the window, double-click maximizes/restores. Every
         non-interactive child carries the attribute too (Tauri starts a
         drag only on the exact target), so the bar drags from anywhere.
         titlebar.js fills .titlebar-buttons; close hides to tray (the Rust
         side turns close requests into hides). -->
    <header>
      <div class="titlebar-row" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <span class="logo" data-tauri-drag-region>L</span>
          <h1 data-tauri-drag-region>Langception</h1>
          <span id="status-pill" class="pill stopped" data-tauri-drag-region>Stopped</span>
          <span id="lang-chip" class="chip" data-tauri-drag-region title="Source language → target language">EN → TH</span>
          <span id="profile-chip" class="chip profile hidden" data-tauri-drag-region title="The foreground app matches this Profile — its zones, glossary and language are what the loop runs with">Profile: <span id="profile-name"></span></span>
          <span id="privacy-chip" class="chip privacy hidden" data-tauri-drag-region title="The active Translate Engine sends screen text off-machine">☁ cloud</span>
          <span id="adjust-chip" class="chip hidden" data-tauri-drag-region>Adjust</span>
        </div>
        <div class="header-actions">
          <button id="pause-btn" class="btn" disabled>Pause</button>
          <button id="adjust-btn" class="btn">Adjust</button>
          <button id="toggle-btn" class="btn">Start</button>
          <button id="settings-btn" class="btn">Settings</button>
          <div class="titlebar-buttons"></div>
        </div>
      </div>
      <div id="warnings-line" class="warnings-line hidden"></div>
    </header>

    <details id="mode-panel" class="zones-panel mode-panel" open>
      <summary>
        <span>Capture Target</span>
        <span class="hint" id="mode-hint"></span>
      </summary>
      <div class="mode-grid">
        <label class="mode-row">
          <input type="radio" name="capture-target" value="zones" id="mode-zones" />
          <span>Capture Zones — watch the zones listed below</span>
        </label>
        <label class="mode-row">
          <input type="radio" name="capture-target" value="fullscreen" id="mode-fullscreen" />
          <span>Full screen — every Text Block on one monitor (minus Excluded Blocks)</span>
        </label>
        <label class="mode-row monitor-row" id="monitor-row">
          <span class="monitor-label">Monitor</span>
          <select id="monitor-select" class="monitor-select"></select>
        </label>
      </div>
    </details>

    <details id="zones-panel" class="zones-panel" open>
      <summary>
        <span id="zones-title">Capture Zones (0)</span>
        <button id="new-zone-btn" class="btn small">+ New Zone</button>
      </summary>
      <ul id="zones-list" class="zones-list"></ul>
      <div id="zones-empty" class="zones-empty hidden"></div>
    </details>

    <details id="excluded-panel" class="zones-panel">
      <summary>
        <span id="excluded-title">Excluded Blocks (0)</span>
        <span class="hint">full-screen mode skips these positions</span>
      </summary>
      <ul id="excluded-list" class="zones-list"></ul>
      <div id="excluded-empty" class="zones-empty hidden"></div>
    </details>

    <div id="error-banner" class="error-banner hidden"></div>

    <main>
      <ul id="results" class="results"></ul>
      <div id="empty-state" class="empty-state">
        <p>No translations yet.</p>
        <p class="hint" id="empty-hint"></p>
      </div>
    </main>

    <div id="copied-toast" class="toast hidden">Copied ✓</div>
    <script src="titlebar.js"></script>
    <script src="main.js"></script>
  </body>
</html>
