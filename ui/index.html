<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Langception — Results</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Frameless window (ticket 16): the first row is the drag region —
         drag moves the window, double-click maximizes/restores. Every
         non-interactive child carries the attribute too (Tauri starts a
         drag only on the exact target), so the bar drags from anywhere.
         titlebar.js fills .titlebar-buttons; close hides to tray (the Rust
         side turns close requests into hides). Ticket 62: user-visible
         text carries i18n keys (data-i18n / data-i18n-title), applied by
         i18n.js once main.js resolves the language from get_status. -->
    <header>
      <div class="titlebar-row" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <img class="logo" src="logo.png" alt="" data-tauri-drag-region>
          <h1 data-tauri-drag-region>Langception</h1>
          <span id="status-pill" class="pill stopped" data-tauri-drag-region data-i18n="results.status.stopped">Stopped</span>
          <span id="lang-chip" class="chip" data-tauri-drag-region data-i18n-title="results.lang_chip.title" title="Source language → target language">EN → TH</span>
          <span id="profile-chip" class="chip profile hidden" data-tauri-drag-region data-i18n-title="results.profile_chip.title" title="The foreground app matches this Profile — its zones, glossary and language are what the loop runs with"><span data-i18n="results.profile_chip.prefix">Profile: </span><span id="profile-name"></span></span>
          <span id="privacy-chip" class="chip privacy hidden" data-tauri-drag-region data-i18n-title="results.privacy_chip.title" title="The active Translate Engine sends screen text off-machine" data-i18n="results.privacy_chip.text">☁ cloud</span>
          <span id="adjust-chip" class="chip hidden" data-tauri-drag-region data-i18n="results.adjust.chip">Adjust</span>
        </div>
        <div class="header-actions">
          <button id="pause-btn" class="btn" disabled data-i18n="results.pause_btn">Pause</button>
          <button id="adjust-btn" class="btn" data-i18n="results.adjust_btn">Adjust</button>
          <button id="toggle-btn" class="btn" data-i18n="results.toggle.start">Start</button>
          <button id="settings-btn" class="btn" data-i18n="results.settings_btn">Settings</button>
          <div class="titlebar-buttons"></div>
        </div>
      </div>
      <div id="warnings-line" class="warnings-line hidden"></div>
    </header>

    <details id="mode-panel" class="zones-panel mode-panel" open>
      <summary>
        <span data-i18n="results.mode_panel.title">Capture Target</span>
        <span class="hint" id="mode-hint"></span>
      </summary>
      <div class="mode-grid">
        <!-- Ticket 61: the redesign's segmented Capture-Mode control. The
             radios stay the real controls (keyboard arrow switching, the
             change events main.js listens on) — CSS hides them and styles
             the checked label as the active segment (:has). -->
        <div class="segmented">
          <label class="mode-row">
            <input type="radio" name="capture-target" value="zones" id="mode-zones" />
            <span data-i18n="results.mode_zones">Capture Zones — watch the zones listed below</span>
          </label>
          <label class="mode-row">
            <input type="radio" name="capture-target" value="fullscreen" id="mode-fullscreen" />
            <span data-i18n="results.mode_fullscreen">Full screen — every Text Block on one monitor (minus Excluded Blocks)</span>
          </label>
        </div>
        <label class="mode-row monitor-row" id="monitor-row">
          <span class="monitor-label" data-i18n="results.monitor_label">Monitor</span>
          <select id="monitor-select" class="monitor-select"></select>
        </label>
      </div>
    </details>

    <details id="zones-panel" class="zones-panel" open>
      <summary>
        <span id="zones-title" data-i18n="results.zones_title.initial">Capture Zones (0)</span>
        <button id="new-zone-btn" class="btn small" data-i18n="results.new_zone_btn">+ New Zone</button>
      </summary>
      <ul id="zones-list" class="zones-list"></ul>
      <div id="zones-empty" class="zones-empty hidden"></div>
    </details>

    <details id="excluded-panel" class="zones-panel">
      <summary>
        <span id="excluded-title" data-i18n="results.excluded_title.initial">Excluded Blocks (0)</span>
        <span class="hint" data-i18n="results.excluded_panel.hint">full-screen mode skips these positions</span>
      </summary>
      <ul id="excluded-list" class="zones-list"></ul>
      <div id="excluded-empty" class="zones-empty hidden"></div>
    </details>

    <div id="error-banner" class="error-banner hidden"></div>

    <main>
      <ul id="results" class="results"></ul>
      <!-- Ticket 61: the redesign's empty-state card — icon, title, the
           hotkey list as pressed-key rows (main.js builds them from the
           live hotkey config), and two quick actions mirroring the header's
           Start and + New Zone. -->
      <div id="empty-state" class="empty-state">
        <div class="empty-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="14" x="3" y="5" rx="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg>
        </div>
        <p data-i18n="results.empty_state.title">No translations yet.</p>
        <div id="empty-shortcuts" class="empty-shortcuts"></div>
        <div class="empty-cta">
          <button id="empty-new-zone" class="btn" data-i18n="results.new_zone_btn">+ New Zone</button>
          <button id="empty-start" class="btn primary" data-i18n="results.empty_cta.start">Start now</button>
        </div>
      </div>
    </main>

    <div id="copied-toast" class="toast hidden" data-i18n="results.copied_toast">Copied ✓</div>
    <script src="i18n.js"></script>
    <script src="titlebar.js"></script>
    <script src="main.js"></script>
  </body>
</html>
