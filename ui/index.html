<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Langception — Results</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo">L</span>
        <h1>Langception</h1>
        <span id="status-pill" class="pill stopped">Stopped</span>
        <span id="privacy-chip" class="chip privacy hidden" title="The active Translate Engine sends screen text off-machine">☁ cloud</span>
        <span id="adjust-chip" class="chip hidden">Adjust</span>
        <button id="pause-btn" class="btn" disabled>Pause</button>
        <button id="adjust-btn" class="btn">Adjust</button>
        <button id="toggle-btn" class="btn">Start</button>
        <button id="settings-btn" class="btn">Settings</button>
      </div>
      <div id="config-line" class="config-line">loading…</div>
      <div id="warnings-line" class="warnings-line hidden"></div>
    </header>

    <details id="mode-panel" class="zones-panel mode-panel" open>
      <summary>
        <span>Capture Target</span>
        <span class="hint" id="mode-hint"></span>
      </summary>
      <div class="mode-grid">
        <label class="mode-row">
          <input type="radio" name="capture-target" value="zones" id="mode-zones" />
          <span>Capture Zones — watch the zones listed below</span>
        </label>
        <label class="mode-row">
          <input type="radio" name="capture-target" value="fullscreen" id="mode-fullscreen" />
          <span>Full screen — every Text Block on one monitor (minus Excluded Blocks)</span>
        </label>
        <label class="mode-row monitor-row" id="monitor-row">
          <span class="monitor-label">Monitor</span>
          <select id="monitor-select" class="monitor-select"></select>
        </label>
      </div>
    </details>

    <details id="zones-panel" class="zones-panel" open>
      <summary>
        <span id="zones-title">Capture Zones (0)</span>
        <button id="new-zone-btn" class="btn small">+ New Zone</button>
      </summary>
      <ul id="zones-list" class="zones-list"></ul>
      <div id="zones-empty" class="zones-empty hidden"></div>
    </details>

    <details id="excluded-panel" class="zones-panel">
      <summary>
        <span id="excluded-title">Excluded Blocks (0)</span>
        <span class="hint">full-screen mode skips these positions</span>
      </summary>
      <ul id="excluded-list" class="zones-list"></ul>
      <div id="excluded-empty" class="zones-empty hidden"></div>
    </details>

    <div id="error-banner" class="error-banner hidden"></div>

    <main>
      <ul id="results" class="results"></ul>
      <div id="empty-state" class="empty-state">
        <p>No translations yet.</p>
        <p class="hint" id="empty-hint"></p>
      </div>
    </main>

    <div id="copied-toast" class="toast hidden">Copied ✓</div>
    <script src="main.js"></script>
  </body>
</html>
