[package]
name = "langception-core"
version.workspace = true
edition = "2021"
description = "Langception core: translation-loop orchestrator, ports, glossary, engines"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
# The fused vision engines (ticket 12) attach the captured frame to the
# model call: encoded as PNG, transported base64 (Gemini inlineData and
# the OpenAI-compatible image_url data URL).
base64 = "0.22"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
reqwest = { version = "0.13", features = ["query"] }
# Model Pack verification (ADR-0008, deferred-model-packs ticket 01):
# SHA-256 per manifest file, ZIP for the pack archives the assembly
# unpacks into the active models directory (deflate only — the packaging
# side produces plain deflate/stored zips).
sha2 = "0.10"
zip = { version = "9.8", default-features = false, features = ["deflate"] }
# "process" + "io-util" + "time" drive the OCR sidecars (ticket 31; the
# PP-OCRv6 one since the pp-ocrv6-sidecar feature): piped stdin/stdout,
# line reads and writes, init/request timeouts. "macros" is the
# orchestrator loop's `tokio::select!` — declared here so the crate
# compiles on its own, not only under workspace feature unification.
# "rt" is the pack downloader's spawned download tasks (ADR-0008, ticket
# 03): downloads are core-owned, not window-owned, so they must outlive
# any subscriber that started them.
tokio = { version = "1", features = ["sync", "process", "io-util", "time", "macros", "rt"] }

[dev-dependencies]
# "net" + "io-util" drive the fake HTTP engine of the prompt-seam tests
# (a localhost server that captures the adapter's request bodies).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
