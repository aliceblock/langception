[package]
name = "langception"
version.workspace = true
edition = "2021"
description = "Langception: screen-capture OCR + Thai translation overlay (Windows)"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
langception-core = { path = "../crates/langception-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Remembers the three user-resizable windows' size + position across
# restarts (ticket 58); registered with a label filter so the overlays and
# the picker never take part.
tauri-plugin-window-state = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# Timestamps for the app/crash logs (ticket 27); already in the dependency
# tree via Tauri.
chrono = "0.4"
dirs = "6"

# The loop-event forward's regression test runs against the mock runtime
# (mock_app + mock webview windows): the forward's broadcast behavior is
# observable without a real display.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
