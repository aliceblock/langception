name: Release

# A tag push vX.Y.Z builds the two release artifacts — the NSIS installer
# and the portable zip — and publishes them to a GitHub Release for the
# tag. Cutting a release is therefore: bump the version in
# src-tauri/tauri.conf.json + both Cargo.toml files, tag, push the tag.
# See docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: NSIS installer + portable zip (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # Separate from CI's cache: this job builds the release profile,
          # and sharing target artifacts with the debug-profile CI job
          # would evict each other's entries every run.
          prefix-key: release

      # Fail before a long build when the tag and the app version drift.
      # The tag is the release; the config version is what the installer,
      # the exe metadata, and the About tab report.
      - name: Check tag matches the app version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($config.version -ne $tagVersion) {
            Write-Error "tag $env:GITHUB_REF_NAME does not match the version in src-tauri/tauri.conf.json ($($config.version))"
          }
          Write-Host "releasing $tagVersion"

      - name: Tests
        run: cargo test --workspace

      # The PP-OCRv6 bundle (pp-ocrv6-sidecar tickets 03/04): the models
      # are fetched first (SHA-256-verified, into the layout the sidecar's
      # launch contract fixes), then the sidecar exe we build is copied in
      # beside them — the flat resources/pp-ocrv6/ layout the app resolves
      # and `tauri build` bundles (resources glob in tauri.conf.json).
      - name: Fetch the PP-OCRv6 models
        shell: pwsh
        run: packaging/fetch-pp-ocrv6.ps1

      - name: Build the PP-OCRv6 sidecar exe into the resources folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build -p pp-ocrv6-sidecar --release
          Copy-Item "target/release/pp-ocrv6-sidecar.exe" "src-tauri/resources/pp-ocrv6/pp-ocrv6-sidecar.exe"

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # npm's `tauri` command (the cargo one isn't installed on CI).

      # No frontend build step: ui/ is static and embedded into the exe.
      # The NSIS bundle lands at
      # target/release/bundle/nsis/Langception_<version>_x64-setup.exe and
      # its installer downloads the WebView2 runtime when missing
      # (bundle > windows > webviewInstallMode in tauri.conf.json).
      - name: Build the NSIS installer
        run: tauri build

      # The portable zip is the bare exe (frontend assets are embedded) —
      # no bundler target for this, so it is assembled by hand. The exe is
      # renamed to the product name for the user-facing archive, and the
      # OCR engine folder is laid out beside it exactly as the installer
      # does (the app resolves `resources/pp-ocrv6` next to the exe too).
      - name: Assemble the portable zip
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:TAG.TrimStart("v")
          $stage = "packaging/stage/Langception"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/langception.exe" "$stage/Langception.exe"
          Copy-Item "packaging/PORTABLE-README.txt" "$stage/README.txt"
          Copy-Item "LICENSE" "$stage/LICENSE.txt"
          Copy-Item "src-tauri/resources/pp-ocrv6" "$stage/resources/pp-ocrv6" -Recurse
          $zip = "packaging/Langception_${version}_x64-portable.zip"
          # Defender briefly locks a freshly-copied exe while scanning it,
          # which fails Compress-Archive with "being used by another
          # process" — retry through the scan window.
          $attempt = 0
          while ($true) {
            try {
              Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
              break
            } catch {
              $attempt += 1
              if ($attempt -ge 5) { throw }
              Write-Host "compressed failed (attempt $attempt): $($_.Exception.Message) — retrying"
              Start-Sleep -Seconds 5
            }
          }
          Write-Host "built $zip"
          Get-Item $zip, "target/release/bundle/nsis/*.exe" | Select-Object Name, Length

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/Langception_*_x64-setup.exe
            packaging/Langception_*_x64-portable.zip
